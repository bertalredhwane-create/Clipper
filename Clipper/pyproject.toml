[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Découpe automatique et gratuite de vidéos YouTube en clips"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "yt-dlp>=2024.10.7",
    "faster-whisper>=1.0.0",
    "google-genai>=0.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
]

[project.scripts]
clipper = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
